    <circle cx="100" cy="100" r="78" fill="none" stroke="#f2d24b" stroke-opacity="0.35" stroke-width="2" stroke-dasharray="3 10" stroke-linecap="round"/>
    <circle cx="100" cy="100" r="58" fill="#2fbd7e" fill-opacity="0.08" stroke="#2fbd7e" stroke-opacity="0.5" stroke-width="2"/>
    <text x="100" y="112" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="34" font-weight="700" fill="#2fbd7e">&lt;/&gt;</text>
    <text x="100" y="228" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#8a8880">@allannuwamanya</text>
