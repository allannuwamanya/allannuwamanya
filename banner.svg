  <rect width="1200" height="320" rx="20" fill="url(#glowA)"/>
  <rect width="1200" height="320" rx="20" fill="url(#glowB)"/>
  <rect x="0.5" y="0.5" width="1199" height="319" rx="19.5" fill="none" stroke="#ffffff" stroke-opacity="0.1"/>

  <text x="72" y="92" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" letter-spacing="6" fill="#8a8880">HELLO, I'M</text>
  <text x="68" y="172" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="84" font-weight="800" letter-spacing="-2" fill="url(#name)">Allan <tspan fill="#f2efe9">Nuwamanya</tspan></text>
  <text x="72" y="222" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="26" fill="#2fbd7e">↳ Systems engineer. Infrastructure. AI</text>

