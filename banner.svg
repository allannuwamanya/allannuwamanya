      <stop offset="0" stop-color="#2fbd7e"/>
      <stop offset="1" stop-color="#f2d24b"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.12" cy="0.1" r="0.6">
      <stop offset="0" stop-color="#2fbd7e" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#2fbd7e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.95" cy="1" r="0.5">
      <stop offset="0" stop-color="#f2d24b" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#f2d24b" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
