<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Allan Nuwamanya, number 12 top GitHub committer in Uganda">
  <defs>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2fbd7e"/>
      <stop offset="1" stop-color="#f2d24b"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.12" cy="0.1" r="0.6">
      <stop offset="0" stop-color="#2fbd7e" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#2fbd7e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.95" cy="1" r="0.5">
      <stop offset="0" stop-color="#f2d24b" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#f2d24b" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity="0.07"/>
    </pattern>
      </defs>
  <rect width="1200" height="320" rx="20" fill="#050505"/>
  <rect width="1200" height="320" rx="20" fill="url(#dots)"/>
  <rect width="1200" height="320" rx="20" fill="url(#glowA)"/>
  <rect width="1200" height="320" rx="20" fill="url(#glowB)"/>
  <rect x="0.5" y="0.5" width="1199" height="319" rx="19.5" fill="none" stroke="#ffffff" stroke-opacity="0.1"/>

  <text x="600" y="162" text-anchor="middle" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="92" font-weight="800" letter-spacing="-2" fill="url(#name)">Allan <tspan fill="#f2efe9">Nuwamanya</tspan></text>

  <g transform="translate(428 192)">
    <rect width="344" height="40" rx="20" fill="#f2d24b" fill-opacity="0.1" stroke="#f2d24b" stroke-opacity="0.4"/>
    <text x="172" y="26" text-anchor="middle" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#f6dc6d">#12 top GitHub committer in Uganda</text>
  </g>

</svg>
